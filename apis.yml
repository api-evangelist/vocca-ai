aid: vocca-ai
name: Vocca Ai
description: >-
  Vocca is a healthcare voice-AI company (backed by Speedinvest) that builds AI
  voice and text agents acting as a 24/7 receptionist for medical groups and
  practices. Vocca handles inbound and outbound patient calls, appointment
  bookings, reminders, and follow-ups across specialties including imaging,
  dental, cardiology, gynecology, ophthalmology, anesthesiology, general
  medicine, hospitals, and multi-practice clinics, so clinical teams spend less
  time on admin and more time on care. The company operates a customer-facing
  product with French and English coverage; it does not publish a public
  developer portal, API reference, or machine-readable API specification, so
  this profile carries company identity and website link-properties only.
